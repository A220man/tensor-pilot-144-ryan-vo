version: '3.8'

services:
  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tensorpilot-backend
    environment:
      - APP_NAME=TensorPilot
      - APP_VERSION=1.0.0
      - DEBUG=false
      - ENVIRONMENT=production
      - DEMO_MODE=false
      - HOST=0.0.0.0
      - PORT=8000
      - DATABASE_URL=postgresql+asyncpg://tensorpilot:changeme@db:5432/tensorpilot
      - DATABASE_ECHO=false
      - SECRET_KEY=${SECRET_KEY:-changeme}
      - ACCESS_TOKEN_EXPIRE_MINUTES=30
      - REFRESH_TOKEN_EXPIRE_DAYS=7
      - ALGORITHM=RS256
      - OIDC_ENABLED=true
      - OIDC_ISSUER_URL=${OIDC_ISSUER_URL:-https://keycloak.example.com/realms/tensorpilot}
      - OIDC_CLIENT_ID=${OIDC_CLIENT_ID:-tensorpilot-backend}
      - OIDC_CLIENT_SECRET=${OIDC_CLIENT_SECRET}
      - OIDC_AUDIENCE=tensorpilot-api
      - OIDC_JWKS_URI=${OIDC_JWKS_URI:-https://keycloak.example.com/realms/tensorpilot/protocol/openid-connect/certs}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost}
      - LLM_API_KEY=${LLM_API_KEY}
      - LLM_PROVIDER=openai-compatible
      - LLM_MODEL=voxcpm2
      - LLM_BASE_URL=${LLM_BASE_URL}
      - VOXCPM_MODEL_PATH=${VOXCPM_MODEL_PATH}
      - VOXCPM_DEVICE=cuda
      - REDIS_URL=redis://redis:6379/0
      - UPLOAD_DIR=/app/uploads
      - MAX_UPLOAD_SIZE_MB=50
      - LOG_LEVEL=INFO
      - LOG_FORMAT=json
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - backend_uploads:/app/uploads
      - backend_data:/app/data
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/api/v1/healthz', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - tensorpilot-network

  # Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: tensorpilot-frontend
    ports:
      - "127.0.0.1:80:80"
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    restart: unless-stopped
    networks:
      - tensorpilot-network

  # PostgreSQL Database
  db:
    image: postgres:16-alpine
    container_name: tensorpilot-db
    environment:
      - POSTGRES_DB=tensorpilot
      - POSTGRES_USER=tensorpilot
      - POSTGRES_PASSWORD=changeme
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tensorpilot -d tensorpilot"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - tensorpilot-network

  # Redis for caching/sessions
  redis:
    image: redis:7-alpine
    container_name: tensorpilot-redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped
    networks:
      - tensorpilot-network

  # Keycloak for OIDC (development profile)
  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: tensorpilot-keycloak
    command: start-dev
    environment:
      - KC_BOOTSTRAP_ADMIN_USERNAME=admin
      - KC_BOOTSTRAP_ADMIN_PASSWORD=admin
      - KC_DB=dev-file
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - keycloak_data:/opt/keycloak/data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - tensorpilot-network
    profiles:
      - dev

volumes:
  backend_uploads:
  backend_data:
  db_data:
  redis_data:
  keycloak_data:

networks:
  tensorpilot-network:
    driver: bridge